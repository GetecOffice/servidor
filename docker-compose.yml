version: '3.9'

services:
  web:
    build: .
    container_name: valmo_web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env  # Si estás usando un archivo .env para tus variables
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: valmo_db
    restart: always
    environment:
      MYSQL_DATABASE: valmo_db
      MYSQL_USER: valmo_user
      MYSQL_PASSWORD: valmo_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
